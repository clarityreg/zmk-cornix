# Cornix LP user config. Board defconfigs already enable USB, split, pointing,
# encoders, Studio and battery proxying; this only adjusts behaviour.

CONFIG_ZMK_KEYBOARD_NAME="Cornix"

# Debounce, matching the Sofle
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Idle after 10 minutes, deep sleep after 15 minutes
CONFIG_ZMK_IDLE_TIMEOUT=600000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Battery reporting
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# --- Added 2026-10-30 after keymon diagnosis (right-half keys stalling/repeating) ---
# Max radio power on both halves: strengthens the right->left split link and the
# link to the host. Power cost is negligible per the ZMK docs.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Let a host that has forgotten the keyboard pair again onto its old profile.
# ZMK only permits the overwrite when the connecting device's identity address
# matches the stored bond, so a stranger still cannot take over a profile; what
# is lost is protection against a device that spoofs your Mac's/phone's address.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
